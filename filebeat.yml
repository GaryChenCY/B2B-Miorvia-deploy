filebeat.inputs:
  - type: filestream
    id: selected-docker-containers
    enabled: true
    paths:
      - /var/lib/docker/containers/*/*.log
    parsers:
      - container:
          stream: all
          format: docker

processors:
  - add_docker_metadata:
      host: unix:///var/run/docker.sock
  - drop_event:
      when:
        not:
          or:
            - equals:
                container.name: b2b-e-commerce-app
            - equals:
                container.name: b2b-nginx
  - decode_json_fields:
      fields: ["message"]
      target: ""
      overwrite_keys: false
      add_error_key: true
      max_depth: 2

  - add_fields:
      when:
        equals:
          container.name: b2b-e-commerce-app
      target: service
      fields:
        name: b2b-api
  
  - add_fields:
      when:
        equals:
          container.name: b2b-nginx
      target: service
      fields:
        name: nginx

  - add_fields:
      target: deployment
      fields:
        environment: "${APP_ENV:prod}"
  
# Elasticsearch Output
output.elasticsearch:
  hosts:
    - "${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"
  username: "${ELASTICSEARCH_USERNAME}"
  password: "${ELASTICSEARCH_PASSWORD}"

  index: "b2b-logs-${APP_ENV:prod}"

  backoff.init: 1s
  backoff.max: 60s
setup.ilm.enabled: false
setup.template.enabled: false

logging:
  level: info
  to_files: false
  to_stdout: true

http.enabled: true
http.host: 0.0.0.0
http.port: 5066

queue.disk:
  path: "${path.data}/diskqueue"
  max_size: 4GB
  segment_size: 100MB
  read_ahead: 512
  write_ahead: 2048
