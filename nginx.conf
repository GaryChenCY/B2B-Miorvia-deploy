worker_processes auto;
events { worker_connections 1024; }

http{
    include mime.types;
    default_type application/octet-stream;
    sendfile       on;
    tcp_nopush     on;

    # Cloudflare 真實 IP 辨識
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # IPv6 網段（官方清單）
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2c0f:f248::/32;
    set_real_ip_from 2a06:98c0::/29;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # WebSocket upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 接受格式正常的上游 request ID；缺少或格式異常時改用 Nginx 自己產生的 32 字元 ID。
    # App 仍會再次驗證，避免任意 header 內容污染結構化 log。
    map $http_x_request_id $correlation_id {
        "~^[A-Za-z0-9_-]{16,64}$" $http_x_request_id;
        default                    $request_id;
    }

    # JSON log format，給 ELK 用
    log_format cf_json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"real_ip":"$http_cf_connecting_ip",'
        '"xff":"$proxy_add_x_forwarded_for",'
        '"request_id":"$correlation_id",'
        '"upstream_request_id":"$upstream_http_x_request_id",'
        '"cf_ray":"$http_cf_ray",'
        # 不記錄含 query string 的 $request，避免 OAuth code/state 或 token 落入 proxy log。
        '"protocol":"$server_protocol",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"user_agent":"$http_user_agent",'
        '"request_time":$request_time'
        '}';
    
    # log 直接打到 stdout/stderr
    access_log /dev/stdout cf_json;
    error_log /dev/stderr warn;

    # 安全 headers
    server_tokens off;   # 隱藏 Nginx 版本
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # 定義 upstream 群組
    upstream backend{
        server app:9000;
    }

    # HTTP -> HTTPS
    server{
        listen 80;
        server_name api.fromcbl.com;
        # 只做轉址
        return 301 https://$host$request_uri;
    }

    # HTTPS 主 server
    server{
        listen 443 ssl;
        http2 on;
        server_name api.fromcbl.com;

        # ====== 憑證設定[Cloudflare Origin Cert] ======
        ssl_certificate     /etc/nginx/certs/cloudflare-origin.crt;
        ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;
        # ====== TLS 基本最佳實務 ======
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';

        # 靜態檔案: 提供 CDN 讀取 /releases/
        location /releases/ {
            alias /var/www/releases/;
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }
        # 靜態轉發 API 請求
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
        }
        location /auth/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
        }
        # 靜態前端資源
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ =404;
        }
    }

    # Logs server
    server{
        listen 443 ssl;
        server_name logs.fromcbl.com;

        ssl_certificate     /etc/nginx/certs/cloudflare-origin.crt;
        ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;

        location / {
            proxy_pass http://kibana:5601;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $correlation_id;

            # websocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # websocket 長連線必加，避免莫名其妙斷線
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # 避免緩衝導致即時性/串流怪問題
            proxy_buffering off;
        }
    }
}
