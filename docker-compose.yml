services:
  app:
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      - APP_PORT=9000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_MAX_OPEN_CONNS=10
      - DB_MAX_IDLE_CONNS=5
    cpus: "0.50"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    pids_limit: 200  

  # --- Postgres ---
  db:
    image: postgres:16-alpine
    container_name: b2b-postgres
    ports:
      - "127.0.0.1:54321:5432"
    environment:
      - TZ=UTC
      - PGTZ=UTC
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: "0.75"
    mem_limit: 1g
    mem_reservation: 512m
    shm_size: 128m
    pids_limit: 200
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "timezone=UTC"
      - "-c"
      - "max_connections=30"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Elasticsearch ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.8
    container_name: b2b-es
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - elk
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --user elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    mem_limit: 2500m
    mem_reservation: 2000m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65535
        hard: 65535
    profiles: ["observability"]

  #  --- Kibana---
  kibana:
    image: docker.elastic.co/kibana/kibana:8.18.8
    container_name: b2b-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
    depends_on:
      - elasticsearch
    ports:
      - "127.0.0.1:5601:5601"
    networks:
      - elk
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 512m
    pids_limit: 200
    profiles: ["observability"]

  # --- Filebeat ---
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.18.8
    container_name: b2b-filebeat
    user: root
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV}
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${FILEBEAT_USERNAME}
      ELASTICSEARCH_PASSWORD: ${FILEBEAT_PASSWORD}
    networks:
      - elk
    ports:
      - "127.0.0.1:5066:5066"
    restart: unless-stopped
    command: ["filebeat", "-e"]
    healthcheck:
      test: ["CMD-SHELL", "filebeat test config -c /usr/share/filebeat/filebeat.yml"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    mem_limit: 256m
    mem_reservation: 128m
    pids_limit: 150
    profiles: ["observability"]

volumes:
  pg_data:
  es_data:
  filebeat_data:

networks:
  frontend_net:
  backend_net:
    name: b2b_backend_net
  elk:
    name: b2b_elk_net
  
